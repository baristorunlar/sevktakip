<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gürkan Yapı Malzemeleri - Sevkiyat Canlı Bilgi Ekranı</title>
  
  <!-- Kurumsal Favicon -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="shortcut icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  
  <!-- Kurumsal Stil Dosyası -->
  <link rel="stylesheet" href="css/style.css?v=5.9">
  
  <!-- Supabase JS Client (Canlı Veritabanı Senkronizasyonu İçin) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('gurkan_theme_mode_v3') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.body && document.body.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body class="mode-display">

  <!-- ==========================================================================
       1. ULTRA-COMPACT SLIM EXECUTIVE HEADER (HARMONIZED BUTTONS)
       ========================================================================== -->
  <header class="app-header compact-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-logo-wrapper">
          <img src="images/logo.png" alt="Gürkan Yapı Logo" class="brand-logo-img">
        </div>
        <div class="brand-titles">
          <h1>GÜRKAN YAPI MALZEMELERİ</h1>
        </div>
        <div class="sync-badge" title="Gerçek Zamanlı Veritabanı Senkronizasyonu Aktif">
          <span class="pulse-dot"></span>
          <span>CANLI</span>
        </div>
        <div class="live-clock-badge" title="Anlık Canlı Sistem Saati ve Saniyesi">
          <span class="clock-icon">🕒</span>
          <span id="liveClock">00:00:00</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="fullscreenToggleBtn" class="btn-header-tool fullscreen-toggle-btn" title="Tam Ekrana Geç (F11)">
          <span class="fullscreen-icon">⛶</span> <span class="fullscreen-text">Tam Ekran</span>
        </button>
        <button id="themeToggleBtn" class="btn-header-tool theme-toggle-btn" title="Karanlık / Aydınlık Tema Geçişi">
          <span class="theme-icon">🌙</span> <span class="theme-text">Koyu</span>
        </button>
        <a href="admin.html" class="btn-switch-mode admin-switch" title="Panel Girişi Yapın">
          Panel Girişi
        </a>
        <button id="audioToggleBtn" class="audio-toggle-btn" title="Sesli bildirimleri aç/kapat">
          Ses: Açık
        </button>
        <button id="testSoundBtn" class="btn-header-tool" title="Ses motorunu test edin">
          Ses Testi
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================================================
       2. KONTROL BAR & METRİKLER (KPI & ARA-FİLTRE)
       ========================================================================== -->
  <section class="dashboard-bar">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-info">
          <span class="lbl">Haftalık Toplam</span>
          <span class="val" id="totalCount">0</span>
        </div>
      </div>
      <div class="metric-card status-pending">
        <div class="metric-info">
          <span class="lbl">Beklemede</span>
          <span class="val" id="pendingCount">0</span>
        </div>
      </div>
      <div class="metric-card status-transit">
        <div class="metric-info">
          <span class="lbl">Hazırlanan / Yolda</span>
          <span class="val" id="transitCount">0</span>
        </div>
      </div>
      <div class="metric-card status-delivered">
        <div class="metric-info">
          <span class="lbl">Teslim Edildi</span>
          <span class="val" id="deliveredCount">0</span>
        </div>
      </div>
    </div>

    <div class="controls-bar">
      <div class="week-navigator">
        <button id="prevWeekBtn" class="nav-btn" title="Önceki Hafta">◄</button>
        <span id="weekTitle" class="week-title">12 - 17 Ağustos 2026</span>
        <button id="nextWeekBtn" class="nav-btn" title="Sonraki Hafta">►</button>
        <button id="todayWeekBtn" class="btn-secondary" style="margin-left: 0.5rem; padding: 0.35rem 0.65rem; font-size: 0.75rem;">Bu Hafta</button>
      </div>

      <div class="search-filter-group">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Müşteri, adres, temsilci ara...">
        </div>
        <select id="filterStatusSelect" class="filter-select">
          <option value="ALL">Tüm Durumlar</option>
          <option value="Beklemede">Beklemede</option>
          <option value="Hazırlanıyor">Hazırlanıyor</option>
          <option value="Yolda">Yolda</option>
          <option value="Teslim Edildi">Teslim Edildi</option>
          <option value="İptal">İptal</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ==========================================================================
       3. HAFTALIK SEVKİYAT VE BEKLEYEN YÜK NOT ALANI (WEEKLY NOTE BANNER)
       ========================================================================== -->
  <div id="weeklyNoteBannerContainer" class="weekly-note-container"></div>

  <!-- ==========================================================================
       4. HAFTALIK TAKVİM IZGARASI (6 GÜN)
       ========================================================================== -->
  <main class="calendar-wrapper">
    <div id="weeklyGrid" class="weekly-grid">
      <!-- JavaScript dinamik oluşturacak -->
    </div>
  </main>

  <!-- ==========================================================================
       5. ANLIK TOAST BİLDİRİMLERİ
       ========================================================================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ==========================================================================
       6. KURUMSAL LOJİSTİK VE FİLO TAKİP FOOTER BAR
       ========================================================================== -->
  <footer class="corporate-logistics-footer">
    <div class="corporate-highway-track">
      <div class="asphalt-gold-branding">
        <span class="gold-curb-line left"></span>
        <div class="gold-engraved-text">
          <span class="gold-engraved-emblem">❖</span>
          <span class="gold-main-title">GÜRKAN YAPI MALZEMELERİ</span>
          <span class="gold-engraved-emblem">❖</span>
        </div>
        <span class="gold-curb-line right"></span>
      </div>
    </div>
  </footer>

  <!-- SUPABASE PROJE AYARLARI -->
  <script src="js/supabase-config.js?v=1.3"></script>
  <!-- REALTIME CANLI VERİTABANI İLETİŞİM MOTORU -->
  <script src="js/sync.js?v=1.3"></script>
  <!-- ÖRNEK/VARSAYILAN VERİ MODELİ -->
  <script src="js/mockData.js?v=1.3"></script>
  <!-- ANA UYGULAMA MANTIĞI -->
  <script src="js/app.js?v=2.8"></script>
</body>
</html>
