<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gürkan Yapı Malzemeleri - Sevkiyat Takip Sistemi</title>
  
  <!-- Kurumsal Stil Dosyası -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Supabase JS Client (Canlı Veritabanı Senkronizasyonu İçin) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ==========================================================================
       1. KURUMSAL HEADER
       ========================================================================== -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-logo-wrapper">
          <img src="images/logo.png" alt="Gürkan Yapı Logo" class="brand-logo-img">
        </div>
        <div class="brand-titles">
          <h1>GÜRKAN YAPI MALZEMELERİ</h1>
        </div>
        <div class="sync-badge" title="Gerçek Zamanlı Veritabanı Senkronizasyonu Aktif">
          <span class="pulse-dot"></span>
          <span>CANLI</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="audioToggleBtn" class="audio-toggle-btn" title="Sesli bildirimleri aç/kapat">
          🔊 Sesli İkaz Açık
        </button>
        <button id="testSoundBtn" class="btn-secondary" title="Ses motorunu test edin">
          🔔 Ses Testi
        </button>
        <button id="manageRepsBtn" class="btn-secondary" title="Pazarlamacı ve Temsilci Listesini Yönetin">
          ⚙️ Pazarlamacı Yönetimi
        </button>
        <button id="newShipmentBtn" class="btn-primary">
          <span>➕ YENİ SEVKİYAT EKLE</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================================================
       2. KONTROL BAR & METRİKLER (KPI & ARA-FİLTRE)
       ========================================================================== -->
  <section class="dashboard-bar">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-info">
          <span class="lbl">Haftalık Toplam</span>
          <span class="val" id="totalCount">0</span>
        </div>
      </div>
      <div class="metric-card status-pending">
        <div class="metric-info">
          <span class="lbl">Beklemede</span>
          <span class="val" id="pendingCount">0</span>
        </div>
      </div>
      <div class="metric-card status-transit">
        <div class="metric-info">
          <span class="lbl">Hazırlanan / Yolda</span>
          <span class="val" id="transitCount">0</span>
        </div>
      </div>
      <div class="metric-card status-delivered">
        <div class="metric-info">
          <span class="lbl">Teslim Edildi</span>
          <span class="val" id="deliveredCount">0</span>
        </div>
      </div>
    </div>

    <div class="controls-bar">
      <div class="week-navigator">
        <button id="prevWeekBtn" class="nav-btn" title="Önceki Hafta">◄</button>
        <span id="weekTitle" class="week-title">12 - 17 Ağustos 2026</span>
        <button id="nextWeekBtn" class="nav-btn" title="Sonraki Hafta">►</button>
        <button id="todayWeekBtn" class="btn-secondary" style="margin-left: 0.5rem; padding: 0.35rem 0.65rem; font-size: 0.75rem;">Bu Hafta</button>
      </div>

      <div class="search-filter-group">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Müşteri, adres, temsilci ara...">
        </div>
        <select id="filterStatusSelect" class="filter-select">
          <option value="ALL">Tüm Durumlar</option>
          <option value="Beklemede">Beklemede</option>
          <option value="Hazırlanıyor">Hazırlanıyor</option>
          <option value="Yolda">Yolda</option>
          <option value="Teslim Edildi">Teslim Edildi</option>
          <option value="İptal">İptal</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ==========================================================================
       3. HAFTALIK TAKVİM IZGARASI (6 GÜN)
       ========================================================================== -->
  <main class="calendar-wrapper">
    <div id="weeklyGrid" class="weekly-grid">
      <!-- JavaScript dinamik oluşturacak -->
    </div>
  </main>

  <!-- ==========================================================================
       4. SEVKİYAT EKLE / DÜZENLE MODAL
       ========================================================================== -->
  <div id="shipmentModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">YENİ SEVKİYAT GİRİŞİ</h2>
        <button id="closeModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <form id="shipmentForm">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label for="inputDay">Sevkiyat Günü</label>
              <select id="inputDay" required>
                <option value="1">Pazartesi</option>
                <option value="2">Salı</option>
                <option value="3">Çarşamba</option>
                <option value="4">Perşembe</option>
                <option value="5">Cuma</option>
                <option value="6">Cumartesi</option>
              </select>
            </div>

            <div class="form-group">
              <label for="inputShipmentOrder">Sevk Sırası</label>
              <select id="inputShipmentOrder" required>
                <option value="1. Sevk">1. Sevk</option>
                <option value="2. Sevk">2. Sevk</option>
                <option value="3. Sevk">3. Sevk</option>
                <option value="4. Sevk">4. Sevk</option>
                <option value="Ek Sevk">Ek Sevk</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="inputCustomerName">Müşteri / Alıcı Unvanı</label>
              <input type="text" id="inputCustomerName" placeholder="Örn: Yılmaz İnşaat A.Ş." required>
            </div>

            <div class="form-group">
              <label for="inputRepresentative">Müşteri Temsilcisi / Pazarlamacı</label>
              <select id="inputRepresentative" required>
                <!-- JS Dinamik Pazarlamacı Listesi Dolduracak -->
              </select>
            </div>

            <div class="form-group">
              <label for="inputTimeOfDay">Sevkiyat Zaman Dilimi</label>
              <select id="inputTimeOfDay">
                <option value="Sabah Sevkiyatı">Sabah Sevkiyatı (08:00 - 12:00)</option>
                <option value="Öğleden Sonra Sevkiyatı">Öğleden Sonra (13:00 - 17:00)</option>
                <option value="Gün Boyu / Esnek">Gün Boyu / Esnek</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="inputAddress">Teslimat Adresi</label>
              <textarea id="inputAddress" rows="2" placeholder="İlçe ve adres bilgilerini tam giriniz..." required></textarea>
            </div>

            <div class="form-group">
              <label for="inputStatus">Sevkiyat Durumu</label>
              <select id="inputStatus">
                <option value="Beklemede">Beklemede</option>
                <option value="Hazırlanıyor">Hazırlanıyor</option>
                <option value="Yolda">Yolda</option>
                <option value="Teslim Edildi">Teslim Edildi</option>
                <option value="İptal">İptal</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="inputNotes">Sevkiyat Notu (Opsiyonel)</label>
              <input type="text" id="inputNotes" placeholder="Örn: Vinçli araç yanaşacak, kapıda nakit ödeme.">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelModalBtn" class="btn-secondary">İptal</button>
          <button type="submit" class="btn-primary">Kayıt Oluştur</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==========================================================================
       5. PAZARLAMACI / TEMSİLCİ YÖNETİMİ MODAL
       ========================================================================== -->
  <div id="repManagerModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>PAZARLAMACI VE TEMSİLCİ YÖNETİMİ</h2>
        <button id="closeRepModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="add-rep-bar">
          <input type="text" id="newRepInput" placeholder="Yeni Pazarlamacı / Temsilci Adı Giriniz...">
          <button type="button" id="addRepBtn" class="btn-primary">➕ Ekle</button>
        </div>
        
        <div class="rep-list-container">
          <ul id="repListEl" class="rep-list">
            <!-- JS Dinamik Oluşturacak -->
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="doneRepModalBtn" class="btn-primary">Tamam</button>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       6. ANLIK TOAST BİLDİRİMLERİ
       ========================================================================== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- SUPABASE PROJE AYARLARI -->
  <script src="js/supabase-config.js"></script>
  <!-- REALTIME CANLI VERİTABANI İLETİŞİM MOTORU -->
  <script src="js/sync.js"></script>
  <!-- ANA UYGULAMA MANTIĞI -->
  <script src="js/app.js"></script>
</body>
</html>
